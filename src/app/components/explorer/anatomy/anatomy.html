<app-glass-card extraClass="explorer-plant-card">
    <div class="card-header">
        <h3>Diagnostic Anatomy Model</h3>
    </div>
    <p class="card-subtitle">Click on a glowing plant part to explore common symptoms and pathogens</p>

    <div class="plant-svg-container">
        <svg class="plant-svg" viewBox="0 0 200 400" width="100%" height="100%">
            <defs>
                <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="3" result="blur" />
                    <feComposite in="SourceGraphic" in2="blur" operator="over" />
                </filter>
            </defs>

            <!-- Ground Line -->
            <line x1="10" y1="320" x2="190" y2="320" stroke="#334155" stroke-dasharray="3 3" stroke-width="1.5"></line>

            <!-- Roots (interactive group) -->
            <g class="anatomy-zone" [class.active]="selectedSection() === 'roots'" (click)="selectSection.emit('roots')"
                id="roots-anatomy-zone">
                <!-- Root hotspots/background -->
                <rect class="hotspot-bg" x="30" y="322" width="140" height="70" rx="6" id="roots-hotspot"></rect>

                <!-- Root Fibers -->
                <path class="plant-root-strand" d="M100 320 Q85 340 70 370"></path>
                <path class="plant-root-strand" d="M100 320 Q100 350 95 385"></path>
                <path class="plant-root-strand" d="M100 320 Q115 345 130 375"></path>
                <path class="plant-root-strand" d="M95 340 Q75 355 60 365"></path>
                <path class="plant-root-strand" d="M105 340 Q125 355 145 365"></path>
                <path class="plant-root-strand" d="M98 360 Q90 375 80 390"></path>
                <path class="plant-root-strand" d="M102 360 Q110 375 120 390"></path>
            </g>

            <!-- Stem (interactive group) -->
            <g class="anatomy-zone" [class.active]="selectedSection() === 'stem'" (click)="selectSection.emit('stem')"
                id="stem-anatomy-zone">
                <rect class="hotspot-bg" x="80" y="80" width="40" height="238" rx="6" id="stem-hotspot"></rect>
                <!-- Core Stem -->
                <line class="plant-stem" x1="100" y1="320" x2="100" y2="80" stroke="#4d7c0f" stroke-width="4.5"
                    stroke-linecap="round"></line>
            </g>

            <!-- Leaves (interactive group) -->
            <g class="anatomy-zone" [class.active]="selectedSection() === 'leaves'" (click)="selectSection.emit('leaves')"
                id="leaves-anatomy-zone">
                <rect class="hotspot-bg" x="25" y="110" width="150" height="150" rx="6" id="leaves-hotspot"></rect>

                <!-- Leaf 1 Left -->
                <path class="plant-leaf" d="M100 230 Q40 220 30 170 Q70 190 100 215" fill="#65a30d" stroke="#3f6212"
                    stroke-width="1"></path>
                <!-- Leaf 2 Right -->
                <path class="plant-leaf" d="M100 180 Q160 170 170 120 Q130 140 100 165" fill="#65a30d" stroke="#3f6212"
                    stroke-width="1"></path>
                <!-- Leaf 3 Left -->
                <path class="plant-leaf" d="M100 140 Q45 130 35 80 Q75 100 100 125" fill="#65a30d" stroke="#3f6212"
                    stroke-width="1"></path>
            </g>

            <!-- Head/Spike (interactive group) -->
            <g class="anatomy-zone" [class.active]="selectedSection() === 'head'" (click)="selectSection.emit('head')"
                id="head-anatomy-zone">
                <rect class="hotspot-bg" x="65" y="10" width="70" height="70" rx="6" id="head-hotspot"></rect>

                <!-- Wheat Spike Stem -->
                <line class="plant-stem" x1="100" y1="80" x2="100" y2="25" stroke="#4d7c0f" stroke-width="3"
                    stroke-linecap="round"></line>

                <!-- Spikelet kernels (Golden Wheat) -->
                <path class="grain-kernel" d="M100 70 C92 65 92 55 100 50 C108 55 108 65 100 70 Z" fill="#ca8a04">
                </path>
                <path class="grain-kernel" d="M96 55 C88 50 88 40 96 35 C104 40 104 50 96 55 Z" fill="#ca8a04"></path>
                <path class="grain-kernel" d="M104 50 C96 45 96 35 104 30 C112 35 112 45 104 50 Z" fill="#ca8a04">
                </path>
                <path class="grain-kernel" d="M100 35 C92 30 92 20 100 15 C108 20 108 30 100 35 Z" fill="#ca8a04">
                </path>

                <!-- Awns (bristles) -->
                <line x1="92" y1="50" x2="75" y2="35" stroke="#ca8a04" stroke-width="0.8"></line>
                <line x1="108" y1="45" x2="125" y2="30" stroke="#ca8a04" stroke-width="0.8"></line>
                <line x1="92" y1="35" x2="70" y2="20" stroke="#ca8a04" stroke-width="0.8"></line>
                <line x1="108" y1="30" x2="130" y2="15" stroke="#ca8a04" stroke-width="0.8"></line>
                <line x1="100" y1="15" x2="100" y2="2" stroke="#ca8a04" stroke-width="0.8"></line>
            </g>
        </svg>
    </div>
</app-glass-card>
